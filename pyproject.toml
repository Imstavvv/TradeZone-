[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradezone"
version = "2.0.0"
description = "A 35-bot crypto trading desk with risk controls, learning bots and a real-time dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.28", "websockets>=14", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[project.scripts]
tradezone = "tradezone.__main__:main"

[tool.setuptools.packages.find]
include = ["tradezone*"]

[tool.setuptools.package-data]
tradezone = ["web/*.html", "web/*.svg", "web/*.png", "web/*.webmanifest", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so `pytest` (not only `python -m pytest`) finds the app and the tests' shared helpers
markers = ["with_killed: run with the features switched off after failing on unseen data turned back on", "old_plan: run with the stop / target plan from before -7% / +15% (tests of a mechanism, not the defaults)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# the rules the code is kept clean against (CI runs them on every push)
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = [
    "E501",     # long lines: readability first, the formatter isn't used
    "B027",     # empty hook methods on the base classes are deliberate (overridden where needed)
    "ASYNC250", # the command-line token helper asks for input on purpose
]
