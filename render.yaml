# One-click hosting on Render (https://render.com): New > Blueprint > pick this repo.
# The dashboard gets a public https URL. On first visit, type the login code printed in the
# service logs (Render dashboard > tradezone > Logs: "TradeZone login code"). No password needed.
services:
  - type: web
    name: tradezone
    runtime: docker
    plan: starter          # always-on; the free plan sleeps, which would stop the bots
    healthCheckPath: /api/health
    autoDeploy: false      # redeploys restart the bots - deploy deliberately
    envVars:
      - key: TZ_HOST
        value: 0.0.0.0
      - key: TZ_JOURNAL_PATH
        value: /data/tradezone.db
      # Add these yourself in the Render dashboard (never commit keys).
      # A real-money account can also be connected in the app instead (Money > Real-money account).
      # Real money - set ONE of these (TZ_LIVE_VENUE=auto picks Uphold, then Kraken, then Alpaca):
      #   TZ_UPHOLD_TOKEN                             (Uphold access token: python -m tradezone uphold-token)
      #   TZ_KRAKEN_KEY / TZ_KRAKEN_SECRET            (Kraken key WITHOUT withdraw permission)
      #   TZ_ALPACA_LIVE_KEY / TZ_ALPACA_LIVE_SECRET  (Alpaca live account)
      #   TZ_LIVE_VENUE                               (optional: uphold | kraken | alpaca)
      # Recommended when live:
      #   TZ_LIVE_MAX_CAPITAL                         (most USD the bots may trade with - or set it on the home
      #                                                screen: Make-me-money protocol -> Real-money cap)
      # Every other setting and its default: .env.example. Most can also be switched in the app
      # (Settings -> Trading strategies, Never sell at a loss, Real-money risk).
      # Optional:
      #   TZ_ALPACA_KEY / TZ_ALPACA_SECRET            (Alpaca paper + stock data)
      #   TZ_GROK_API_KEY                             (Grok AI analyst)
    disk:
      name: tradezone-data
      mountPath: /data
      sizeGB: 1
